services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: pulsedesk
      POSTGRES_PASSWORD: pulsedesk
      POSTGRES_DB: pulsedesk
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata: